<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mossy Plant Tag</title>
<style>
  :root{
    --paper:#F7F8F5; --ink:#1B2420; --muted:#6B7670;
    --leaf:#2A7D4F; --rule:#D9DED7; --card:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#121613;--ink:#E8EDE7;--muted:#94A09A;--leaf:#5FBF88;--rule:#2C3630;--card:#1A201C}
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 20px;background:var(--paper);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  .card{max-width:420px;width:100%;text-align:center}
  .mark{
    width:76px;height:76px;margin:0 auto 22px;border-radius:50%;
    background:var(--leaf);display:flex;align-items:center;justify-content:center;
  }
  .mark svg{width:40px;height:40px;fill:#fff}
  h1{font-size:27px;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
  p{margin:0 0 18px;color:var(--muted)}
  .plant{
    background:var(--card);border:1px solid var(--rule);border-radius:14px;
    padding:16px;margin:24px 0;text-align:left;display:none;
  }
  .plant.on{display:block}
  .plant .lbl{
    font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    margin-bottom:5px;
  }
  .plant code{
    font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
    word-break:break-all;
  }
  .cta{
    display:inline-block;background:var(--leaf);color:#fff;text-decoration:none;
    font-weight:600;padding:14px 30px;border-radius:999px;margin-top:4px;
  }
  .note{font-size:13px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7 4 4 8 4 13a7 7 0 0 0 12 5c3-3 4-9 4-16-3 1-6 1-8 0Z"/></svg>
    </div>
    <h1>This is a Mossy plant tag</h1>
    <p>Someone tagged a plant with it. Mossy identifies plants, writes their care report, and reminds you when to water — tap the tag and the plant comes straight up.</p>

    <div class="plant" id="plant">
      <div class="lbl">Plant on this tag</div>
      <code id="pid"></code>
    </div>

    <a class="cta" href="#" id="cta">Get Mossy</a>
    <p class="note">Already have Mossy? Open the app and use <b>Scan a Tag</b>.</p>
  </div>

<script>
  // The tag URL is /p/<uuid>. Show the id so a person can tell tags apart.
  var m = location.pathname.match(/\/p\/([0-9a-fA-F-]{36})/);
  if (m) {
    document.getElementById('pid').textContent = m[1];
    document.getElementById('plant').classList.add('on');
  }
</script>
</body>
</html>
